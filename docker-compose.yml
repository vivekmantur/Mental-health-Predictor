
services:

  backend:
    build: ./backend
    container_name: mental_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    restart: always

  frontend:
    build: ./mental-health-ui
    container_name: mental_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./mental-health-ui:/app
      - /app/node_modules
    restart: always